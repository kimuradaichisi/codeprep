<!doctype html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="stylesheet" href="./App.css" />
  <title>CodePrep Desktop</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #1e1e1e;
      color: #e2e8f0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
      user-select: none;
    }
    @keyframes cp-spin {
      to { transform: rotate(360deg); }
    }
    .initial-loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      width: 100vw;
      gap: 16px;
      box-sizing: border-box;
    }
    .initial-loading-brand {
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .initial-loading-spinner {
      width: 24px;
      height: 24px;
      border: 3px solid rgba(59, 130, 246, 0.2);
      border-top-color: #3b82f6;
      border-radius: 50%;
      animation: cp-spin 0.8s linear infinite;
    }
    .initial-loading-title {
      font-size: 18px;
      font-weight: 600;
      letter-spacing: -0.02em;
      margin: 0;
      color: #f8fafc;
    }
    .initial-loading-message {
      font-size: 12px;
      color: #94a3b8;
      margin: 0;
    }
  </style>
</head>
<body>
  <div id="root">
    <div class="initial-loading-container">
      <div class="initial-loading-brand">
        <div class="initial-loading-spinner"></div>
        <h1 class="initial-loading-title">CodePrep</h1>
      </div>
      <p class="initial-loading-message">デスクトップを起動しています... (Starting CodePrep...)</p>
    </div>
  </div>
  <script type="module" src="./App.js"></script>
</body>
</html>
